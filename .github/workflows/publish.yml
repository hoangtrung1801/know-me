name: Build & Publish Know-Me Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: false
        type: string

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            echo "Unable to determine release version"
            exit 1
          fi

          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  verify:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Trace built UI version
        env:
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          UI_PACKAGE_VERSION=$(node -p 'require("./ui/package.json").version')

          echo "expected_version=$EXPECTED_VERSION"
          echo "app_version_env=$APP_VERSION"
          echo "ui_package_version=$UI_PACKAGE_VERSION"

          echo "dist files:"
          ls -la ui/dist
          ls -la ui/dist/assets || true

          echo "version-like strings in dist:"
          grep -RhoE '[0-9]+\.[0-9]+\.[0-9]+' ui/dist | sort -u || true

          echo "search expected version in dist:"
          if grep -R "$EXPECTED_VERSION" ui/dist >/dev/null 2>&1; then
            echo "OK: found expected version $EXPECTED_VERSION in built UI"
          else
            echo "ERROR: expected version $EXPECTED_VERSION not found in built UI"
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 1

  build-binaries:
    needs: [meta, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
            npm_pkg: knowns-darwin-arm64
            ext: ""
            cgo_enabled: "1"
            ort_lib: libonnxruntime.dylib
            bundle_onnx: "true"
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            npm_pkg: knowns-darwin-x64
            ext: ""
            cgo_enabled: "1"
            bundle_onnx: "false"
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            npm_pkg: knowns-linux-x64
            ext: ""
            cgo_enabled: "1"
            ort_lib: libonnxruntime.so
            bundle_onnx: "true"
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            npm_pkg: knowns-linux-arm64
            ext: ""
            cgo_enabled: "1"
            ort_lib: libonnxruntime.so
            bundle_onnx: "true"
          - runner: windows-latest
            goos: windows
            goarch: amd64
            npm_pkg: knowns-win-x64
            ext: ".exe"
            cgo_enabled: "1"
            ort_lib: onnxruntime.dll
            bundle_onnx: "true"
            llvm_mingw_archive: llvm-mingw-20260407-ucrt-x86_64.zip
            llvm_mingw_prefix: x86_64-w64-mingw32
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install llvm-mingw toolchain
        if: matrix.goos == 'windows'
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260407/${{ matrix.llvm_mingw_archive }}"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          TOOLCHAIN_DIR=$(find "$RUNNER_TEMP/llvm-mingw" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Failed to extract llvm-mingw toolchain"
            exit 1
          fi
          {
            echo "$TOOLCHAIN_DIR/bin"
          } >> "$GITHUB_PATH"
          {
            echo "CC=${{ matrix.llvm_mingw_prefix }}-clang"
            echo "CXX=${{ matrix.llvm_mingw_prefix }}-clang++"
            echo "AR=${{ matrix.llvm_mingw_prefix }}-ar"
          } >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.10"

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Run npm installer tests
        if: matrix.goos == 'windows' || (matrix.goos == 'darwin' && matrix.goarch == 'amd64')
        run: bun test npm/knowns/install.test.js

      - name: Trace downloaded UI artifact
        env:
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          echo "checking downloaded ui artifact"
          ls -la ui/dist
          ls -la ui/dist/assets || true
          grep -RhoE '[0-9]+\.[0-9]+\.[0-9]+' ui/dist | sort -u || true
          if grep -R "$EXPECTED_VERSION" ui/dist >/dev/null 2>&1; then
            echo "OK: found expected version $EXPECTED_VERSION in downloaded UI artifact"
          else
            echo "ERROR: expected version $EXPECTED_VERSION not found in downloaded UI artifact"
            exit 1
          fi

      - name: Build release binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          LDFLAGS="-s -w -X github.com/hoangtrung1801/known-me/internal/util.Version=${VERSION}"
          mkdir -p "artifacts/${{ matrix.npm_pkg }}"
          go build -ldflags "$LDFLAGS" -o "artifacts/${{ matrix.npm_pkg }}/knownme${{ matrix.ext }}" ./cmd/knownme

      - name: Bundle ONNX Runtime native library
        if: matrix.bundle_onnx == 'true'
        env:
          ORT_VERSION: "1.25.0"
        run: |
          ARTIFACT_DIR="artifacts/${{ matrix.npm_pkg }}"
          BASE_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}"

          echo "=== Bundling ONNX Runtime ${ORT_VERSION} for ${{ matrix.goos }}/${{ matrix.goarch }} ==="

          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            ARCHIVE="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
            curl -L --retry 5 --retry-delay 5 -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"
            tar -xzf "$ARCHIVE"
            cp "onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" "${ARTIFACT_DIR}/libonnxruntime.so"
            echo "Downloaded libonnxruntime.so (${ORT_VERSION}) for linux/amd64"

          elif [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            ARCHIVE="onnxruntime-linux-aarch64-${ORT_VERSION}.tgz"
            curl -L --retry 5 --retry-delay 5 -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"
            tar -xzf "$ARCHIVE"
            cp "onnxruntime-linux-aarch64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" "${ARTIFACT_DIR}/libonnxruntime.so"
            echo "Downloaded libonnxruntime.so (${ORT_VERSION}) for linux/arm64"

          elif [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            ARCHIVE="onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
            curl -L --retry 5 --retry-delay 5 -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"
            tar -xzf "$ARCHIVE"
            cp "onnxruntime-osx-arm64-${ORT_VERSION}/lib/libonnxruntime.${ORT_VERSION}.dylib" "${ARTIFACT_DIR}/libonnxruntime.dylib"
            echo "Downloaded libonnxruntime.dylib (${ORT_VERSION}) for darwin/arm64"

          elif [ "${{ matrix.goos }}" = "windows" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            ARCHIVE="onnxruntime-win-x64-${ORT_VERSION}.zip"
            curl -L --retry 5 --retry-delay 5 -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"
            unzip -q "$ARCHIVE"
            cp "onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime.dll" "${ARTIFACT_DIR}/onnxruntime.dll"
            echo "Downloaded onnxruntime.dll (${ORT_VERSION}) for windows/amd64"

          else
            echo "FATAL: No download strategy for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi

          # Verify the native lib was bundled
          if ! ls "${ARTIFACT_DIR}"/*onnxruntime* >/dev/null 2>&1; then
            echo "FATAL: No ONNX Runtime library found for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi

          echo "=== Artifact contents ==="
          ls -la "${ARTIFACT_DIR}/"

      - name: Verify macOS Intel package without bundled ONNX
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: |
          ARTIFACT_DIR="artifacts/${{ matrix.npm_pkg }}"
          test -x "${ARTIFACT_DIR}/knownme"
          if find "${ARTIFACT_DIR}" -maxdepth 1 -name '*onnxruntime*' | grep -q .; then
            echo "FATAL: macOS Intel package must not bundle ONNX Runtime"
            exit 1
          fi
          "${ARTIFACT_DIR}/knownme" --version
          output=$("${ARTIFACT_DIR}/knownme" model download gte-small 2>&1) && {
            echo "FATAL: Local ONNX model download unexpectedly succeeded"
            exit 1
          }
          echo "$output" | grep -q "Local ONNX is not bundled for macOS Intel"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: artifacts/${{ matrix.npm_pkg }}/
          retention-days: 1

  release:
    needs: [meta, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Test Linux binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          chmod +x artifacts/knowns-linux-x64/knownme
          artifacts/knowns-linux-x64/knownme --version
          artifacts/knowns-linux-x64/knownme --version | grep -q "$VERSION" || echo "Warning: Version mismatch"

      - name: Prepare npm packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cp README.md npm/knowns/README.md

          PLATFORM_PKGS="knowns-darwin-arm64 knowns-darwin-x64 knowns-linux-arm64 knowns-linux-x64 knowns-win-x64"

          for pkg in $PLATFORM_PKGS; do
            (
              cd "npm/$pkg"
              npm version "$VERSION" --no-git-tag-version --allow-same-version
            )
          done

          (
            cd npm/knowns
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          )

          for dir in artifacts/knowns-*/; do
            pkg=$(basename "$dir")
            case " $PLATFORM_PKGS " in
              *" $pkg "*) ;;
              *) continue ;;
            esac
            mkdir -p "npm/$pkg"
            cp -R "$dir"/. "npm/$pkg/"
            # Mark executables
            for exe in "npm/$pkg/knownme" "npm/$pkg/knownme.exe"; do
              [ -f "$exe" ] && chmod +x "$exe" 2>/dev/null || true
            done
            if [ ! -f "npm/$pkg/knownme" ] && [ ! -f "npm/$pkg/knownme.exe" ]; then
              echo "Missing main binary for $pkg"
              exit 1
            fi
          done

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const repo = { type: 'git', url: 'git+https://github.com/hoangtrung1801/know-me.git' };
          for (const dir of fs.readdirSync('npm')) {
            const pkgPath = path.join('npm', dir, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.repository = repo;
            pkg.homepage = 'https://knowns.sh';
            if (pkg.name === 'knowns') {
              pkg.bin = { knownme: 'bin/knowns.js', kn: 'bin/knowns.js' };
              pkg.optionalDependencies = {
                '@knowns/darwin-arm64': version,
                '@knowns/darwin-x64': version,
                '@knowns/linux-arm64': version,
                '@knowns/linux-x64': version,
                '@knowns/win-x64': version,
              };
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          }
          EOF

      - name: Verify npm package contents
        run: |
          echo "=== Verifying ONNX Runtime native libs in all platform packages ==="

          # Windows: onnxruntime.dll
          if [ ! -f "npm/knowns-win-x64/onnxruntime.dll" ]; then
            echo "FATAL: npm/knowns-win-x64/onnxruntime.dll is missing!"
            ls -la npm/knowns-win-x64/ || true
            exit 1
          fi
          echo "✓ knowns-win-x64/onnxruntime.dll"

          # macOS: libonnxruntime.dylib
          for pkg in knowns-darwin-arm64; do
            if ! ls npm/$pkg/libonnxruntime*.dylib >/dev/null 2>&1; then
              echo "FATAL: npm/$pkg/ missing libonnxruntime dylib!"
              ls -la "npm/$pkg/" || true
              exit 1
            fi
            echo "✓ $pkg/libonnxruntime.dylib"
          done

          if find npm/knowns-darwin-x64 -maxdepth 1 -name '*onnxruntime*' | grep -q .; then
            echo "FATAL: npm/knowns-darwin-x64 must not contain ONNX Runtime"
            exit 1
          fi
          echo "✓ knowns-darwin-x64 intentionally excludes ONNX Runtime"

          # Linux: libonnxruntime.so
          for pkg in knowns-linux-arm64 knowns-linux-x64; do
            if ! ls npm/$pkg/libonnxruntime*.so* >/dev/null 2>&1; then
              echo "FATAL: npm/$pkg/ missing libonnxruntime.so!"
              ls -la "npm/$pkg/" || true
              exit 1
            fi
            echo "✓ $pkg/libonnxruntime.so"
          done

          # Main binary in all packages
          for pkg in knowns-darwin-arm64 knowns-darwin-x64 knowns-linux-arm64 knowns-linux-x64; do
            if [ ! -f "npm/$pkg/knownme" ]; then
              echo "FATAL: npm/$pkg/knownme is missing!"
              exit 1
            fi
            echo "✓ $pkg/knownme"
          done
          if [ ! -f "npm/knowns-win-x64/knownme.exe" ]; then
            echo "FATAL: npm/knowns-win-x64/knownme.exe is missing!"
            exit 1
          fi
          echo "✓ knowns-win-x64/knownme.exe"

      - name: Create tarballs
        run: |
          for pkgdir in \
            npm/knowns-darwin-arm64 \
            npm/knowns-darwin-x64 \
            npm/knowns-linux-arm64 \
            npm/knowns-linux-x64 \
            npm/knowns-win-x64; do
            pkg=$(basename "$pkgdir")
            staging=$(mktemp -d)
            find "$pkgdir" -maxdepth 1 -mindepth 1 \
              ! -name 'package.json' \
              ! -name 'README.md' \
              -exec cp -R {} "$staging/" \;
            tar -czvf "${pkg}.tar.gz" -C "$staging" .
            shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
            alias_pkg=$(echo "$pkg" | sed 's/^knowns-/knownme-/')
            cp "${pkg}.tar.gz" "${alias_pkg}.tar.gz"
            shasum -a 256 "${alias_pkg}.tar.gz" > "${alias_pkg}.tar.gz.sha256"
            rm -rf "$staging"
          done

      - name: Verify tarball contents
        run: |
          for archive in \
            knowns-darwin-arm64.tar.gz; do
            tar -tzf "$archive" | grep -Fx "./knownme" >/dev/null || { echo "$archive missing knownme"; exit 1; }
            tar -tzf "$archive" | grep -E "^\./libonnxruntime.*\.dylib$" >/dev/null || { echo "$archive missing libonnxruntime dylib"; exit 1; }
          done

          tar -tzf knowns-darwin-x64.tar.gz | grep -Fx "./knownme" >/dev/null || {
            echo "knowns-darwin-x64.tar.gz missing knownme"
            exit 1
          }
          if tar -tzf knowns-darwin-x64.tar.gz | grep -i "onnxruntime" >/dev/null; then
            echo "knowns-darwin-x64.tar.gz must not contain ONNX Runtime"
            exit 1
          fi

          for archive in \
            knowns-linux-arm64.tar.gz \
            knowns-linux-x64.tar.gz; do
            tar -tzf "$archive" | grep -Fx "./knownme" >/dev/null || { echo "$archive missing knownme"; exit 1; }
            tar -tzf "$archive" | grep -E "^\./libonnxruntime\.so" >/dev/null || { echo "$archive missing libonnxruntime.so"; exit 1; }
          done

          for archive in knowns-win-x64.tar.gz; do
            tar -tzf "$archive" | grep -Fx "./knownme.exe" >/dev/null || { echo "$archive missing knownme.exe"; exit 1; }
            tar -tzf "$archive" | grep -Fx "./onnxruntime.dll" >/dev/null || { echo "$archive missing onnxruntime.dll"; exit 1; }
          done

          # Verify ELF architecture matches package platform.
          # e_machine at ELF offset 18: 0x3E = x86_64, 0xB7 = aarch64.
          verify_elf_arch() {
            local archive="$1" file="$2" expected_hex="$3" label="$4"
            tmpdir=$(mktemp -d)
            tar -xzf "$archive" -C "$tmpdir"
            machine=$(od -An -tx1 -j18 -N2 "$tmpdir/$file" | tr -d ' ')
            rm -rf "$tmpdir"
            if [ "$machine" != "$expected_hex" ]; then
              echo "FATAL: $archive contains $file with wrong ELF arch (got $machine, expected $expected_hex for $label)"
              exit 1
            fi
            echo "✓ $archive $file arch=$label"
          }

          verify_elf_arch knowns-linux-x64.tar.gz  ./libonnxruntime.so "3e00" "x86_64"
          verify_elf_arch knowns-linux-arm64.tar.gz ./libonnxruntime.so "b700" "aarch64"
          verify_elf_arch knowns-linux-x64.tar.gz   ./knownme            "3e00" "x86_64"
          verify_elf_arch knowns-linux-arm64.tar.gz  ./knownme            "b700" "aarch64"

          macho_dir=$(mktemp -d)
          tar -xzf knowns-darwin-x64.tar.gz -C "$macho_dir"
          (file "$macho_dir/knownme" | grep -q "Mach-O 64-bit" &&
            file "$macho_dir/knownme" | grep -q "x86_64") || {
            echo "FATAL: knowns-darwin-x64.tar.gz contains the wrong binary architecture"
            exit 1
          }
          rm -rf "$macho_dir"

      - name: Ensure GitHub release exists
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes

      - name: Upload binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          for file in *.tar.gz *.sha256 install/install.sh install/install.ps1 install/uninstall.sh install/uninstall.ps1; do
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
